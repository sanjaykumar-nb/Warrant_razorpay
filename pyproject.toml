[project]
name = "warrant"
version = "0.1.0"
description = "Detects agent-mediated unauthorised spend: purchases an AI shopping agent made that fall outside what the human actually asked for."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.40",
    "rich>=13.9",
]

[project.scripts]
warrant = "warrant.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]
